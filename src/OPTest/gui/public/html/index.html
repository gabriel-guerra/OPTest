<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OPTest</title>
    <link rel="stylesheet" href="../css/popupMenu.css">
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
    <div class="overlay">
        <h1>OPTest</h1>
    
        <div class="container">
            

        </div>

        <div class="container divisionContainer">
            
            <div class="container pathContainer">

                <input id="input-test-folder" class="path-input fullContainer" type="text" value="">
                <div tabindex="0" class="animationButton" type="button" onclick="">
                    <svg class="icon folderIcon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-folder-fill" viewBox="0 0 16 16">
                      <path d="M9.828 3h3.982a2 2 0 0 1 1.992 2.181l-.637 7A2 2 0 0 1 13.174 14H2.825a2 2 0 0 1-1.991-1.819l-.637-7a2 2 0 0 1 .342-1.31L.5 3a2 2 0 0 1 2-2h3.672a2 2 0 0 1 1.414.586l.828.828A2 2 0 0 0 9.828 3m-8.322.12q.322-.119.684-.12h5.396l-.707-.707A1 1 0 0 0 6.172 2H2.5a1 1 0 0 0-1 .981z"/>
                    </svg>
                </div>

            </div>

            <div class="container">

                <div tabindex="0" class="animationButton" type="button" onclick="buildCreateTest()">
                    <svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 30 30">
                        <g mask="url(#mask0_21_345)">
                        <path d="M13.75 23.75V16.25H6.25V13.75H13.75V6.25H16.25V13.75H23.75V16.25H16.25V23.75H13.75Z"></path>
                        </g>
                    </svg>
                </div>
    
                <div tabindex="0" class="animationButton" type="button" onclick="loadEditTestPage()">
                    <svg class="icon pencilIcon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-pencil-fill" viewBox="0 0 16 16">
                        <path d="M12.854.146a.5.5 0 0 0-.707 0L10.5 1.793 14.207 5.5l1.647-1.646a.5.5 0 0 0 0-.708zm.646 6.061L9.793 2.5 3.293 9H3.5a.5.5 0 0 1 .5.5v.5h.5a.5.5 0 0 1 .5.5v.5h.5a.5.5 0 0 1 .5.5v.5h.5a.5.5 0 0 1 .5.5v.207zm-7.468 7.468A.5.5 0 0 1 6 13.5V13h-.5a.5.5 0 0 1-.5-.5V12h-.5a.5.5 0 0 1-.5-.5V11h-.5a.5.5 0 0 1-.5-.5V10h-.5a.5.5 0 0 1-.175-.032l-.179.178a.5.5 0 0 0-.11.168l-2 5a.5.5 0 0 0 .65.65l5-2a.5.5 0 0 0 .168-.11z"/>
                    </svg>
                </div>
                <div tabindex="0" class="animationButton trashButton" type="button" onclick="deleteTest()">
                    <svg class="trashIcon icon" viewBox="0 0 15 17.5" height="17.5" width="15" xmlns="http://www.w3.org/2000/svg" class="icon">
                        <path transform="translate(-2.5 -1.25)" d="M15,18.75H5A1.251,1.251,0,0,1,3.75,17.5V5H2.5V3.75h15V5H16.25V17.5A1.251,1.251,0,0,1,15,18.75ZM5,5V17.5H15V5Zm7.5,10H11.25V7.5H12.5V15ZM8.75,15H7.5V7.5H8.75V15ZM12.5,2.5h-5V1.25h5V2.5Z" id="Fill"></path>
                    </svg>
                </div>
                
                <div tabindex="0" class="animationButton playButton" type="button" onclick="runTest()">
                    <svg class="icon playIcon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-play-fill" viewBox="0 0 16 16">
                        <path d="m11.596 8.697-6.363 3.692c-.54.313-1.233-.066-1.233-.697V4.308c0-.63.692-1.01 1.233-.696l6.363 3.692a.802.802 0 0 1 0 1.393"/>
                    </svg>
                </div>

            </div>


           
            
        </div>

        <select id="tests-list" class="file-selector" multiple size="15">
        </select>
        <input name="show-log-output" type="checkbox" checked onchange="toggleLogOutput()">
        <label for="show-log-output">Show log output</label>

        <pre id="log-output" style="user-select: text;"></pre>

    </div>
    
    <dialog id="menu-create-test-file" class="popupMenu">
        <div class="headerPopup">
            <span onclick="closeIndexPopUpMenu('menu-create-test-file'); event.stopPropagation();" class="closePopup" title="Close Modal">&times;</span>
            <h4>Create new test file</h4>
        </div>
        
        <form class="form" action="">
            <div class="popupContainer">
                <label for="input-new-test">Test Name</label>
                <input type="text" class="inputFormat" name="input-new-test" id="input-new-test">
            </div>
            <button class="actionButtonPopup" type="submit" id="create-test-save-button" value="save_new_test">Create</button>
        </form>
    </dialog>
    


</body>
<script src="../js/jsApi.js"></script>
</html>
