<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OPTest - Edit</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
    <button id="btn-create-object" onclick="">Create object</button>
    <button id="btn-edit-field" onclick="">Edit field</button>
    <button id="btn-bulk-edit-field" onclick="">Edit multiple fields</button>
    <button id="btn-edit-field-associate-object" onclick="">Edit field on associate object</button>
    <button id="btn-start-workflow" onclick="">Start workflow</button>
    <button id="btn-delete-object" onclick="">Delete object</button>
    <button id="btn-delete-step" onclick="">Delete test step</button>
    <button id="btn-finish-edit" onclick="loadIndexPage()">Finish edit</button>
    
    <div>
        <table id="test-actions">
            <tr>
                <th>Action Type</th>
                <th>Action information</th>
                <th>Edit</th>
            </tr>
        </table>
    </div>

    <div id="menu-create-object" class="hide">
        <button onclick="closePopUpMenu('menu-create-object')">Close</button>
        <form action="">
            <div>
                <label for="input-resource-type-definition">Object Type</label>
                <input type="text" name="input-resource-type-definition" id="input-resource-type-definition">
            </div>
            <div>
                <label for="input-resource-name">Object Name</label>
                <input type="text" name="input-resource-name" id="input-resource-name">
            </div>
            <div>
                <label for="input-resource-description">Description</label>
                <input type="text" name="input-resource-description" id="input-resource-description">
            </div>
            <div>
                <label for="input-resource-primary-parent">Primary parent ID</label>
                <input type="text" name="input-resource-primary-parent" id="input-resource-primary-parent">
            </div>
            <div>
                <table id="table-fields">
                    <tr>
                        <th>Field</th>
                        <th>Value</th>
                        <th>Action</th>
                    </tr>
                </table>
            </div>
            <div>
                <table id="table-parents">
                    <tr>
                        <th>Parant ID</th>
                        <th>Action</th>
                    </tr>
                </table>
            </div>
            <div>
                <table id="table-children">
                    <tr>
                        <th>Child ID</th>
                        <th>Action</th>
                    </tr>
                </table>
            </div>
            <button type="submit" id="save-button" value="create_object">Save</button>
        </form>
    </div>
    <div id="menu-create-object">
    </div>

</body>
<script src="../js/editTest.js"></script>
<script src="../js/jsApi.js"></script>
</html>
